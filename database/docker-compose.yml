services:
  mongo:
    image: mongo:7
    container_name: klogubizz-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: klogubizz
    volumes:
      - klogubizz_mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro

volumes:
  klogubizz_mongo_data:
